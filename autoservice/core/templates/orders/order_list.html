{% extends "base.html" %}
{% block title %}Список заказов{% endblock %}
{% block content %}
<div class="card">
  <h2>Список заказов</h2>
  <a href="{% url 'order_create' %}">Создать заказ</a>
  <ul>
    {% for order in orders %}
      <li>
        Заказ №{{ order.id }} — статус: {{ order.status }}
        <a href="{% url 'order_detail' order.id %}">Подробнее</a>
      </li>
    {% empty %}
      <li>Заказов пока нет</li>
    {% endfor %}
  </ul>
</div>
{% endblock %}
