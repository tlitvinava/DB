{% extends "base.html" %}
{% block title %}Изменить статус заказа{% endblock %}
{% block content %}
<div class="card">
  <h2>Изменить статус заказа #{{ order.id }}</h2>
  <form method="post">
    {% csrf_token %}
    <label for="status_id">Статус:</label>
    <select name="status_id" id="status_id">
      {% for s in statuses %}
        <option value="{{ s.id }}" {% if s.id == order.status.id %}selected{% endif %}>
          {{ s.statusname }}
        </option>
      {% endfor %}
    </select>
    <button type="submit">Сохранить</button>
  </form>
</div>
{% endblock %}
