{% extends "base.html" %}
{% block title %}{{ action }} запчасть{% endblock %}
{% block content %}
<div class="card">
  <h2>{{ action }} запчасть</h2>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">{{ action }}</button>
    <a class="btn secondary" href="{% url 'parts_list' %}">Отмена</a>
  </form>
</div>
{% endblock %}
