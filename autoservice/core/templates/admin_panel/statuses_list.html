{% extends "base.html" %}
{% block title %}Статусы{% endblock %}
{% block content %}
<div class="card">
  <h2>Статусы заказов</h2>
  <div style="margin-bottom:10px;">
    <a class="btn" href="{% url 'status_create' %}">Создать статус</a>
    <a class="btn secondary" href="{% url 'admin_panel' %}">Назад</a>
  </div>

  <table>
    <thead><tr><th>Статус</th><th>Действия</th></tr></thead>
    <tbody>
      {% for item in page %}
        <tr>
          <td>{{ item.statusname }}</td>
          <td class="actions">
            <a class="btn secondary" href="{% url 'status_edit' item.pk %}">Редактировать</a>
            <form action="{% url 'status_delete' item.pk %}" method="post" style="display:inline;">
              {% csrf_token %}
              <button class="btn danger" type="submit">Удалить</button>
            </form>
          </td>
        </tr>
      {% empty %}
        <tr><td colspan="2">Статусов нет</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
