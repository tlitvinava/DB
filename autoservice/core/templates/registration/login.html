{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="card">
  <h2>Вход</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Войти</button>
  </form>

  <p style="margin-top:15px;">
    Ещё нет аккаунта?
    <a href="{% url 'register' %}">Зарегистрироваться</a>
  </p>
</div>
{% endblock %}
